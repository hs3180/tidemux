# Test fixture for Logstash 8.19.5; not distributed.
# Install the test template before the first event.
input {
  file {
    id => "tidemux_stderr"
    path => ["${TIDEMUX_LOG_PATH}"]
    start_position => "beginning"
    sincedb_path => "${TIDEMUX_SINCEDB_PATH}"
    ecs_compatibility => "v8"
  }
}
filter {
  json { source => "message" target => "tidemux" tag_on_failure => ["tidemux_json_failure"] }
  if "tidemux_json_failure" not in [tags] {
    ruby {
      code => '
        v = event.get("tidemux")
        unless v.is_a?(Hash) && v["schema_version"] == 2 && v["event"].is_a?(String) && v["timestamp"].is_a?(String) && v["event_id"].is_a?(String)
          event.tag("tidemux_schema_failure")
        end
      '
    }
    if "tidemux_schema_failure" not in [tags] {
      date { match => ["[tidemux][timestamp]", "ISO8601"] target => "@timestamp" tag_on_failure => ["tidemux_time_failure"] }
    }
  }
  if "tidemux_json_failure" in [tags] or "tidemux_schema_failure" in [tags] or "tidemux_time_failure" in [tags] {
    # Retain the original line, but avoid mapping malformed decoded fields.
    mutate { remove_field => ["tidemux"] add_field => { "[collector][error]" => "parse_failure" "[@metadata][index]" => "${TIDEMUX_ES_INDEX_PREFIX}-parse-failures-%{+yyyy.MM.dd}" } }
  } else {
    mutate {
      copy => { "[tidemux][event]" => "[event][action]" "[tidemux][level]" => "[log][level]" }
      remove_field => ["message"]
      add_field => { "[@metadata][index]" => "${TIDEMUX_ES_INDEX_PREFIX}-%{+yyyy.MM.dd}" }
    }
  }
}
output {
  if [tidemux][event_id] {
    elasticsearch {
      id => "tidemux_elasticsearch"
      hosts => ["${TIDEMUX_ES_URL}"]
      api_key => "${TIDEMUX_ES_API_KEY}"
      ssl_enabled => true
      ssl_certificate_authorities => ["${TIDEMUX_ES_CA}"]
      ecs_compatibility => "v8"
      index => "%{[@metadata][index]}"
      data_stream => false
      ilm_enabled => false
      manage_template => false
      document_id => "%{[tidemux][event_id]}"
    }
  } else {
    elasticsearch {
      id => "tidemux_parse_failures"
      hosts => ["${TIDEMUX_ES_URL}"]
      api_key => "${TIDEMUX_ES_API_KEY}"
      ssl_enabled => true
      ssl_certificate_authorities => ["${TIDEMUX_ES_CA}"]
      ecs_compatibility => "v8"
      index => "%{[@metadata][index]}"
      data_stream => false
      ilm_enabled => false
      manage_template => false
    }
  }
  if [collector][error] {
    file { path => "${TIDEMUX_PARSE_FAILURE_PATH}" codec => json_lines }
  }
}
