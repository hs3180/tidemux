# Run separately with a DIFFERENT path.data after the main pipeline flushes.
input {
  dead_letter_queue {
    path => "${TIDEMUX_DLQ_PATH}"
    pipeline_id => "main"
    commit_offsets => false
  }
}
filter {
  mutate { add_field => { "[collector][error]" => "mapping_failure" } }
  ruby { code => 'event.set("[collector][reason]", event.get("[@metadata][dead_letter_queue][reason]"))' }
}
output {
  file { path => "${TIDEMUX_MAPPING_FAILURE_PATH}" codec => json_lines }
}
