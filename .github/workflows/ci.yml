name: Candidate verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
          cache: true
      - name: Format, test, vet and race
        run: |
          test -z "$(gofmt -l cmd internal)"
          CGO_ENABLED=0 go test ./...
          CGO_ENABLED=0 go vet ./...
          go test -race ./...
          python3 scripts/test_provider_add_pty.py
          python3 -m py_compile scripts/test_elasticsearch_package.py
          python3 -m py_compile scripts/test_client_recovery_package.py
          sh -n scripts/install.sh
          python3 scripts/test_install.py
          python3 scripts/test_client_commands.py
      - name: Build candidate
        run: python3 scripts/release.py --build-id commit
      - name: Verify packaged routing, budgets and logs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, tarfile, tempfile
          archives = list(Path("dist").glob("*/*.tar.gz"))
          if len(archives) != 1:
              raise SystemExit("Expected one immutable candidate archive")
          with tempfile.TemporaryDirectory(prefix="tidemux-package-ci.") as temporary:
              with tarfile.open(archives[0]) as archive:
                  archive.extractall(temporary)
              binary, = Path(temporary).glob("tidemux-*/tidemux")
              for script in ["test_anthropic_server_tools_package.py",
                             "test_tool_history_package.py",
                             "test_shared_model_affinity_package.py",
                             "test_auto_chain_package.py",
                             "test_hot_reload_package.py",
                             "test_provider_sessions_package.py",
                             "test_budget_recovery_package.py",
                             "test_budget_reservation_package.py",
                             "test_report_budget_package.py",
                             "test_client_reliability_package.py",
                             "test_startup_logs_package.py",
                             "test_runtime_logs_package.py"]:
                  subprocess.run(["python3", "scripts/" + script, "--binary", str(binary)], check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-darwin-arm64
          path: dist/
          if-no-files-found: error
